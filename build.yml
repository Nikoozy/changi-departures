# Builds the Mac (Apple silicon + Intel) and Windows apps on GitHub's own computers.
# Runs on every push to main, or by hand: Actions tab > "Build apps" > Run workflow.
# The finished zips appear under Releases (newest at the top).
name: Build apps

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Offline tests (no browser, no internet)
        run: python -m pytest -m "not browser and not live" -q

  mac:
    name: Mac (${{ matrix.arch }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: Apple-silicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Build the app
        run: python -m PyInstaller --noconfirm --clean changi_departures.spec
      - name: Check the app starts
        run: |
          APP="dist/Changi Departures.app/Contents/MacOS/ChangiDepartures"
          "$APP" --no-browser --no-menu-bar --stay-open --port 8790 --output-dir "$RUNNER_TEMP/selftest" &
          PID=$!
          ok=""
          for _ in $(seq 1 90); do
            if curl -sf -m 2 http://127.0.0.1:8790/api/config | grep -q "Changi Departures"; then ok=1; break; fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          if [ -z "$ok" ]; then
            echo "::error::The built app did not start"
            cat "$RUNNER_TEMP"/selftest/logs/*.log 2>/dev/null || true
            exit 1
          fi
          echo "The app starts and its page answers."
      - name: Zip
        run: ditto -c -k --keepParent "dist/Changi Departures.app" "Changi-Departures-Mac-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: Changi-Departures-Mac-${{ matrix.arch }}.zip
          retention-days: 2   # the release keeps the permanent copy

  windows:
    name: Windows
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Build the app
        run: python -m PyInstaller --noconfirm --clean changi_departures.spec
      - name: Check the app starts
        shell: pwsh
        run: |
          $exe = "dist\ChangiDepartures\ChangiDepartures.exe"
          $out = Join-Path $env:RUNNER_TEMP "selftest"
          $p = Start-Process -FilePath $exe -ArgumentList "--no-browser","--port","8790","--output-dir",$out -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:8790/api/config
              if ($r.Content -match "Changi Departures") { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Host "::error::The built app did not start"
            Get-Content "$out\logs\*.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "The app starts and its page answers."
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item settings.example.json dist\ChangiDepartures\settings.json
          Compress-Archive -Path dist\ChangiDepartures -DestinationPath Changi-Departures-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Changi-Departures-Windows.zip
          retention-days: 2

  release:
    name: Publish release
    needs: [mac, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la *.zip
          TAG="build-${{ github.run_number }}"
          NOTES=$(printf '%s\n' \
            "Built from commit ${GITHUB_SHA::7}." "" \
            "- **Mac with Apple silicon (M1 or later):** Changi-Departures-Mac-Apple-silicon.zip" \
            "- **Older Intel Mac:** Changi-Departures-Mac-Intel.zip" \
            "- **Windows:** Changi-Departures-Windows.zip" "" \
            "Mac: unzip, drag the app into Applications, then run once in Terminal:" \
            '`xattr -cr "/Applications/Changi Departures.app"`')
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }} ($(date -u +%Y-%m-%d))" --notes "$NOTES" *.zip
